name: Browser Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/browser-acceptance.yml"

jobs:
  demo-browser-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrmis_user
          POSTGRES_PASSWORD: hrmis_password
          POSTGRES_DB: hrmis_saas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrmis_user -d hrmis_saas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      FLASK_ENV: development
      SECRET_KEY: browser-acceptance-secret-key-000000000000
      JWT_SECRET_KEY: browser-acceptance-jwt-secret-111111111111
      DATABASE_URL: postgresql://hrmis_user:hrmis_password@127.0.0.1:5432/hrmis_saas
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      DEMO_PASSWORD: BrowserAcceptance2026!
      DEMO_REFERENCE_DATE: 2026-08-06
      VITE_API_BASE_URL: http://localhost:5000/api
      E2E_BASE_URL: http://localhost:5173
      E2E_DEMO_PASSWORD: BrowserAcceptance2026!
      RATELIMIT_DEFAULT: "50000 per day;5000 per hour"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare deterministic database
        working-directory: backend
        run: |
          flask --app run.py db upgrade
          flask --app run.py demo-reset --yes --as-of "$DEMO_REFERENCE_DATE"
      - name: Start API
        working-directory: backend
        run: nohup flask --app run.py run --no-debugger --no-reload --host 127.0.0.1 --port 5000 > /tmp/kinetic-api.log 2>&1 &

      - name: Install and start frontend
        working-directory: frontend
        run: |
          npm ci
          nohup npm run dev -- --host 127.0.0.1 > /tmp/kinetic-frontend.log 2>&1 &

      - name: Install browser acceptance dependencies
        working-directory: frontend/e2e
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Wait for services
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:5000/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173 >/dev/null \
              && exit 0
            sleep 2
          done
          cat /tmp/kinetic-api.log || true
          cat /tmp/kinetic-frontend.log || true
          exit 1
      - name: Run deployment smoke checks
        env:
          API_BASE_URL: http://127.0.0.1:5000
          DEMO_SMOKE_PASSWORD: BrowserAcceptance2026!
        run: ./scripts/smoke_demo.sh
      - name: Run Playwright acceptance suite
        working-directory: frontend/e2e
        env:
          E2E_DEMO_PASSWORD: BrowserAcceptance2026!
        run: npm test
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-artifacts
          path: |
            frontend/e2e/test-results
            frontend/e2e/playwright-report
            /tmp/kinetic-api.log
            /tmp/kinetic-frontend.log
